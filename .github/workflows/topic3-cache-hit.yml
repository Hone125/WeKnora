name: Embedding Cache Hit Experiment

# 热缓存命中实验（课题三 · 成本可观测 · 验收）。
#
# 与 topic3-eval-real.yml 的「真实门禁」不同，本 workflow 在 CI 里起最小后端环境
# （postgres 带 pgvector + redis + 编译启动 server），在同一 server 进程内连续跑
# 两遍同一默认数据集评测：第一遍冷缓存（全部 miss、真实 HTTP 调用），第二遍热缓存
# （应命中进程内/DB 缓存、HTTP 调用骤降）。用 embedding 直接计数量化「缓存省了多少
# 次真实 provider 往返」，而不是靠缓存表行数猜。详细方案见 docs/。
#
# 触发：一次性受控实验，只在 workflow_dispatch 手动触发（会消耗真实模型额度）。

on:
  workflow_dispatch:

concurrency:
  group: cache-hit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

  # ===== 运行环境（CI 临时实例固定值，非敏感）=====
  DB_DRIVER: postgres
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_USER: weknora
  DB_PASSWORD: weknora-pass
  DB_NAME: weknora
  REDIS_ADDR: 127.0.0.1:6379
  RETRIEVE_DRIVER: postgres
  AUTO_MIGRATE: "true"
  SYSTEM_AES_KEY: "0123456789abcdef0123456789abcdef"
  JWT_SECRET: ci-jwt-secret
  STORAGE_TYPE: local
  LOCAL_STORAGE_BASE_DIR: /tmp/weknora-ci/files
  GIN_MODE: release

  # ===== 模型配置（敏感值来自 Secrets）=====
  LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
  LLM_MODEL_NAME: ${{ secrets.EVAL_LLM_MODEL_NAME }}
  LLM_BASE_URL: ${{ secrets.EVAL_LLM_BASE_URL }}
  LLM_PROVIDER: ${{ secrets.EVAL_LLM_PROVIDER || 'openai' }}
  EMBEDDING_API_KEY: ${{ secrets.EVAL_EMBEDDING_API_KEY }}
  EMBEDDING_MODEL_NAME: ${{ secrets.EVAL_EMBEDDING_MODEL_NAME }}
  EMBEDDING_BASE_URL: ${{ secrets.EVAL_EMBEDDING_BASE_URL }}
  EMBEDDING_PROVIDER: ${{ secrets.EVAL_EMBEDDING_PROVIDER || 'openai' }}
  EMBEDDING_DIMENSION: ${{ secrets.EVAL_EMBEDDING_DIMENSION || '1024' }}

  # ===== 评测客户端 =====
  BASE_URL: http://localhost:8080
  EVAL_EMAIL: ci-eval@weknora.local
  EVAL_PASSWORD: ci-eval-pass-123
  EVAL_TIMEOUT_MS: "1800000"

jobs:
  cache-hit:
    name: embedding cache hit experiment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: paradedb/paradedb:v0.22.2-pg17
        env:
          POSTGRES_USER: weknora
          POSTGRES_PASSWORD: weknora-pass
          POSTGRES_DB: weknora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weknora -d weknora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required model secrets
        run: |
          missing=0
          for v in LLM_API_KEY LLM_MODEL_NAME LLM_BASE_URL EMBEDDING_API_KEY EMBEDDING_MODEL_NAME EMBEDDING_BASE_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少 repository secret EVAL_${v}"
              missing=1
            fi
          done
          exit $missing

      - name: Build server
        run: go build -o bin/server ./cmd/server

      - name: Generate builtin_models.yaml
        run: |
          mkdir -p /tmp/weknora-ci
          cat > /tmp/weknora-ci/builtin_models.yaml <<'EOF'
          builtin_models:
            - id: ci-embedding-default
              type: Embedding
              is_default: true
              name: ${EMBEDDING_MODEL_NAME}
              parameters:
                base_url: ${EMBEDDING_BASE_URL}
                api_key: ${EMBEDDING_API_KEY}
                provider: ${EMBEDDING_PROVIDER}
                embedding_parameters:
                  dimension: ${EMBEDDING_DIMENSION}
                  truncate_prompt_tokens: 0
            - id: ci-llm-default
              type: KnowledgeQA
              is_default: true
              name: ${LLM_MODEL_NAME}
              parameters:
                base_url: ${LLM_BASE_URL}
                api_key: ${LLM_API_KEY}
                provider: ${LLM_PROVIDER}
          EOF
          echo "✅ builtin_models.yaml 已生成"

      - name: Start server and run cache-hit experiment
        run: |
          export BUILTIN_MODELS_CONFIG=/tmp/weknora-ci/builtin_models.yaml
          mkdir -p /tmp/weknora-ci/files
          nohup ./bin/server > /tmp/weknora-ci/server.log 2>&1 &
          SERVER_PID=$!
          echo "server pid=${SERVER_PID}"
          sleep 3
          if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
            echo "::error::server 启动后立即退出，日志："
            tail -n 60 /tmp/weknora-ci/server.log || true
            exit 1
          fi
          echo "✅ server 进程存活，开始等待迁移与模型注册"
          bash scripts/cache-hit-ci.sh

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/weknora-ci/server.log
          if-no-files-found: ignore
