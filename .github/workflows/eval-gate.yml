name: Eval Quality Gate

# 质量门禁（课题三 · M4）。两个 job：
#   unit      — 跑门禁判定逻辑的单元测试（internal/evalgate，不依赖 cgo/gojieba，可在 CI 干净运行）。
#   gate-demo — 用「降召回」fixture 自证门禁会正确阻断：期望 evalgate 退出码 1 并报出 recall 退化。
#
# 完整「真实评测 → 门禁」流水线见 scripts/eval-gate.sh：它先跑一次评测（需真实模型 Key），
# 再调 evalgate 判定。本 workflow 的 gate-demo 用 fixture 替代真实评测，使门禁逻辑本身
# 无需任何 secret 即可在 CI 里被验证；要接入真实评测，把 job 里 fixture 替换为
# `bash scripts/eval-gate.sh` 并配置 EVAL_* secret 即可。

on:
  schedule:
    # 每周一 UTC 18:30（避开整点，错峰触发）
    - cron: "30 18 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/evalgate/**"
      - "cmd/evalgate/**"
      - "eval_gate.json"
      - "scripts/eval-gate.sh"
      - "docs/eval_gate_regression_fixture.json"
      - ".github/workflows/eval-gate.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  unit:
    name: evalgate unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Test internal/evalgate
        run: go test ./internal/evalgate/

  gate-demo:
    name: gate blocks recall regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build evalgate
        run: go build -o evalgate ./cmd/evalgate

      - name: Gate must FAIL a recall regression
        run: |
          set +e
          ./evalgate -config eval_gate.json -result docs/eval_gate_regression_fixture.json
          code=$?
          set -e
          echo "gate exit=$code"
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (gate fail) for the regression fixture, got $code"
            exit 1
          fi
          echo "✅ gate correctly blocked the recall regression"

      - name: Gate must PASS a healthy result
        run: |
          set +e
          printf '%s' '{"data":{"metric":{"retrieval_metrics":{"recall":0.55,"precision":0.12}}}}' \
            | ./evalgate -config eval_gate.json
          code=$?
          set -e
          echo "gate exit=$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::expected exit 0 (gate pass) for a healthy result, got $code"
            exit 1
          fi
          echo "✅ gate correctly passed the healthy result"
